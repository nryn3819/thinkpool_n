<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/common.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="wrap">
            <h1 class="visually-hidden">씽크풀</h1>
            <h2 class="visually-hidden">Title for screen readers</h2>
            <a class="visually-hidden-focusable" href="#container">Skip to main content</a>
            <div class="visually-hidden-focusable">A container with a <a href="#">focusable element</a>.</div>
            <!-- header - header.scss -->
            <header id="header" class="clearfix item">
                <h2 class="visually-hidden">상단영역</h2>
                <div id="top" class="float-start">
                    
                    <div class="pageBack">
                        <button type="button" onclick="history.back()">이전페이지</button>
                    </div>
                    <!-- //이전페이지 -->
                
                    <div class="headerTitle text-truncate centerHeader">
                        <strong>관심회원 등록</strong>
                    </div>
                    <!-- //종목명  헤더가 바뀝니다. -->

                    <div class="rightBtn">
                        <a href="#" class="app">앱다운로드</a>
                    </div>

                </div>
                <!-- //top -->
            </header>
            <!-- // -->

            <main id="container" class="clearfix">
                <h2 class="visually-hidden">본문영역</h2>

                <section class="section noPadding">
                    <div class="addmem-w rpt-0 rpb-20" >
                        <div class="addmem-sch rmt-20">
                            <input type="text" placeholder="종목 검색" class="text-center" id="opensch">
                            <button><img src="./img/b-sch9.png" alt="" width="20" class="float-start"></button>
                        </div>
                        <!-- //페이지 이동입니다. -->
                    </div>


                    <div class="searcharea">
                        <div class="searcharea-header">
                            <h4 class="logo"><img src="./img/logo.png" alt="" width="32"></h4>
                            <!-- // -->
                            <div class="searcharea-sch">
                                <div class="input-group">
                                    <input type="text" class="form-control" placeholder="종목명 / 종목코드 / 키워드" id="inputsch">
                                    <button class="btn-img schButton" type="button" id="button-addon">검색하기</button>
                                </div>
                            </div>
                            <!-- // -->
                            <button type="button" class="btn-close text-reset sch-hide"></button>
                        </div>
                        <!-- // -->

                        <div class="searcharea-body">
                            <div class="favtop">
                                <strong>인기 관심종목</strong>

                                <button class="btn-custom-board float-end">
                                    선택종목 추가 +
                                </button>
                            </div>

                            <div class="favitemlist">
                                <div class="form-check">
                                    <input type="checkbox" id="999001" name="favcheck" class="form-check-input">
                                    <label for="999001" class="form-check-label">스튜디오산타 <em>(999000)</em></label>
                                </div>
                                <!-- // -->
                                
                                <div class="form-check">
                                    <input type="checkbox" id="999002" name="favcheck" class="form-check-input">
                                    <label for="999002">스튜디오산타 <em>(999000)</em></label>
                                </div>
                                <!-- // -->
                                
                                <div class="form-check">
                                    <input type="checkbox" id="999003" name="favcheck" class="form-check-input">
                                    <label for="999003">스튜디오산타 <em>(999000)</em></label>
                                </div>
                                <!-- // -->
                                
                                <div class="form-check">
                                    <input type="checkbox" id="999004" name="favcheck" class="form-check-input">
                                    <label for="999004">스튜디오산타 <em>(999000)</em></label>
                                </div>
                                <!-- // -->
                                
                                <div class="form-check">
                                    <input type="checkbox" id="999005" name="favcheck" class="form-check-input">
                                    <label for="999005">스튜디오산타 <em>(999000)</em></label>
                                </div>
                                <!-- // -->
                                
                                <div class="form-check">
                                    <input type="checkbox" id="999006" name="favcheck" class="form-check-input">
                                    <label for="999006">스튜디오산타 <em>(999000)</em></label>
                                </div>
                                <!-- // -->
                                
                                <div class="form-check">
                                    <input type="checkbox" id="999007" name="favcheck" class="form-check-input">
                                    <label for="999007">스튜디오산타 <em>(999000)</em></label>
                                </div>
                                <!-- // -->
                                
                                <div class="form-check">
                                    <input type="checkbox" id="999008" name="favcheck" class="form-check-input">
                                    <label for="999008">스튜디오산타 <em>(999000)</em></label>
                                </div>

                            </div>
                        </div>
                        <!-- // -->
                    </div>

                    <script>
                        document.getElementById('opensch').addEventListener('click', function(){

                            document.querySelector('.searcharea').classList.add('sch-show')

                            document.getElementById('inputsch').focus();
                            document.getElementById('inputsch').value = "";
                        });


                        document.querySelector('.sch-hide').addEventListener('click', function(){

                            document.querySelector('.searcharea').classList.remove('sch-show')
                        });


                    </script>

                    <div class="board board-tbl rpt-25">

                        <div class="board-top rmb-15 rpr-0 rpl-0">
                            <button class="btn-custom-board float-start">저장하기</button>
                            <button class="btn-custom-board float-end">선택삭제</button>
                        </div>


                        <div class="tbl">
                            <table class="table-custom-sm" width="100%">
                                <colgroup>
                                    <col width="40">
                                    <col width="*">
                                    <col width="90">
                                    <col width="30">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th></th>
                                        <th scope="col">종목명</th>
                                        <th scope="col">삭제하기</th>
                                        <th scope="col" class="text-center rpl-5">
                                            <div class="form-check rpt-3">
                                                <input type="checkbox" name="" id="allcheck" class="form-check-input">
                                            </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="text-center">
                                            <span class="onoff">
                                                <img src="./img/fav.png" alt="" width="19" class="off">
                                                <img src="./img/favOn.png" alt="" width="19" class="on">
                                            </span>
                                        </td>
                                        <td class="text-start">
                                            <span class="d-block text-truncate fs15 fw-bold name">종목명종목명</span>
                                            <span class="d-block pr fs14">
                                                <em>331,000</em>
                                                <em class="dn">-0.6%</em>
                                            </span>
                                        </td>
                                        <td class="text-center">
                                            <button class="delete">삭제</button>
                                        </td>
                                        <td class="text-center">
                                            <div class="form-check rpt-2">
                                                <input type="checkbox" name="tblcheck" id="" class="form-check-input">
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-center">
                                            <span class="onoff on">
                                                <img src="./img/fav.png" alt="" width="19" class="off">
                                                <img src="./img/favOn.png" alt="" width="19" class="on">
                                            </span>
                                        </td>
                                        <td class="text-start">
                                            <span class="d-block text-truncate fs15 fw-bold name">종목명종목명</span>
                                            <span class="d-block pr fs14">
                                                <em>331,000</em>
                                                <em class="dn">-0.6%</em>
                                            </span>
                                        </td>
                                        <td class="text-center">
                                            <button class="delete">삭제</button>
                                        </td>
                                        <td class="text-center">
                                            <div class="form-check rpt-2">
                                                <input type="checkbox" name="tblcheck" id="" class="form-check-input">
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>



                        <div class="board-btm rmt-15 rpr-0 rpl-0">
                            <button class="btn-custom-board float-start">저장하기</button>
                            <button class="btn-custom-board float-end">선택삭제</button>
                        </div>
                    </div>

                    <div class="hspace50"></div>
                </section>
            </main>

            <footer id="footer" class="clearfix">
                <menu id="fmenu">
                    <figure class="figure">
                        <img src="./img/flogin.png" class="figure-img img-fluid" alt="로그인">
                        <figcaption class="figure-caption text-center rmt-7">로그인</figcaption>
                    </figure>
                    <figure class="figure">
                        <img src="./img/fpc.png" class="figure-img img-fluid" alt="PC버전">
                        <figcaption class="figure-caption text-center rmt-7">PC버전</figcaption>
                    </figure>
                    <figure class="figure">
                        <img src="./img/fdw.png" class="figure-img img-fluid" alt="씽크풀앱 다운로드">
                        <figcaption class="figure-caption text-center">씽크풀앱<br>다운로드</figcaption>
                    </figure>
                </menu>

                <menu id="fmenu2">
                    <a href="#">고객센터</a>
                    <a href="#">이용약관</a>
                    <a href="#">개인정보처리방침</a>
                </menu>

                <div class="copyright">
                    <span class="d-block">@Thinkpool</span>
                    <span class="d-block">
                        본사이트에서 게재되는 정보는 오류 및 지연이 있을 수 있으며 <br>
                        그 이용에 따르는 책임은 이용자 본인에게 있습니다. 
                    </span>
                </div>
            </footer>
            
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

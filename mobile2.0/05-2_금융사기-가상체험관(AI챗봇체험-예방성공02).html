<!doctype html>
<html lang="ko">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!-- common.css -->
  <link rel="stylesheet" href="./css/common.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <!-- swiper -->
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
  <script src="https://fastly.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <title>씽크풀</title>
</head>

<body>

  <div id="app">
    <div id="wrap">
      <h1 class="visually-hidden">씽크풀</h1>
      <h2 class="visually-hidden">Title for screen readers</h2>
      <a class="visually-hidden-focusable" href="#container">Skip to main content</a>
      <div class="visually-hidden-focusable">A container with a <a href="#">focusable element</a>.</div>

      <main id="container" class="clearfix">
        <h2 class="visually-hidden">본문영역</h2>
        <section class="section fraud-virtual">
          <div class="virtual-header">
            <div>
              <span>
                <img width="25" src="img/call-icon.png" alt="">
              </span>
              <strong>보이스 피싱 가상체험</strong>
            </div>
            <button class="end" data-bs-toggle="modal" data-bs-target="#endVirtual">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M19.6151 19.6151L11.769 11.769M11.769 11.769L3.92285 3.92285M11.769 11.769L19.6152 3.92285M11.769 11.769L3.92285 19.6152" stroke="#999999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <!-- 타이틀 -->
          <div class="virtual-phishing">
            <div class="phishing-result success">
              <div class="top">
                <div class="title success">사기범이 보이스피싱 통화를 포기하였습니다.</div>
                <div class="txt">
                  사기방지에 성공하였지만 <br />
                  조금 더 단호한 대응이 필요합니다. <br />
                  한번 더 진행하여 완벽한 체험을 경험해 보세요.
                </div>
                <button class="link">디지털 금융사기 사전예방 바로가기</button>
              </div>
              <div class="bot">
                <button>체험 다시하기</button>
                <button>기본체험 홈</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 모의체험 종료 팝업 -->
        <div class="modal fade openPopup" id="endVirtual" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-body">
                <button data-bs-dismiss="modal" class="btn-close"></button>
                <div class="title">모의체험 종료</div>
                <div class="txt text-center">
                  보이스피싱 AI챗봇 체험을 종료하시겠습니까?
                </div>
                <div class="btn-group rmt-25">
                  <button>종료</button>
                  <button data-bs-dismiss="modal">취소</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

    </div>
    <!-- /wrap -->
    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"></script>
    <!-- //bootstrap js -->
  </div>
  <!-- //app -->



</body>

</html>

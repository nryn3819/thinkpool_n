<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/member.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="member">
            <header class="member-header">
                <div class="hbtn">
                    <a href="#" class="backpage"></a>
                </div>
                <div class="htitle">회원탈퇴</div>
            </header>
            <!-- // -->
            <main class="member-container">

                <section class="member withdraw info-m">
                    
                    <div class="member-title">
                        <strong>회원탈퇴</strong>
                    </div>
                    <!-- // -->

                    <div class="pw-complete">
                        <div class="userid"><strong>Wonna</strong>님</div>
                        <div class="rmt-25"><strong>씽크풀 회원탈퇴를 진행합니다.</strong></div>

                        <div class="rmt-25">
                            <span>
                                회원탈퇴를 하시면 회원님이 보유하고 계신
                                <em class="up">씽크캐시 및 모든 데이터가 자동 소멸</em> 되오니,
                                신중하게 생각하신 후 결정하시기 바랍니다.  <br><br>

                                탈퇴후에는 현재 사용중이던 아이디로는
                                다시 가입하실 수 없으며, 같은 필명으로는
                                한달동안 가입이 불가 합니다. <br><br>

                                필명변경을 원하시면  <em class="dn">회원정보관리</em> 에서<br>
                                변경 가능 합니다. 
                            </span>
                        </div>

                        <div class="button text-center rmt-25">
                            <button class="btn-custom-primary outline" style="width:38%;">필명변경하기</button>
                        </div>
                    </div>

                    <div class="user-input-info rmt-25">
                        <div class="info">
                            <div class="input-list">
                                <div class="position-relative">
                                    <label for="userInfo01">비밀번호</label>
                                    <div>
                                        <input type="password" id="userInfo01" class="form-control" placeholder="비밀번호를 입력하세요.">
                                        <div class="invalid-feedback">비밀번호를 잘못 입력하셨습니다.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo02">탈퇴사유</label>
                                    <div>
                                        <textarea class="form-control" name="" id="" rows="1"></textarea>
                                        <div class="invalid-feedback">비밀번호를 잘못 입력하셨습니다.</div>
                                    </div>
                                </div>
                                <!-- // -->
                            </div>
                            <!-- // -->
                        </div>
                        <!-- // -->
                    </div>

                    <div class="button text-center rmt-60">
                        <button class="btn-custom-default member" style="width:40%;">취소</button>
                        <button class="btn-custom-primary member" data-bs-toggle="modal" data-bs-target="#modal1" style="width:40%;">확인</button>
                    </div>


                    <div class="modal fade custom-modal1" id="modal1" aria-hidden="true" aria-labelledby="" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="modal-basic-text text-center">

                                        회원탈퇴 가 완료되었습니다.

                                    </div>
                                    <!-- // -->
                                </div>
                                <div class="modal-footer text-center cm-footer">
                                    <button class="btn-custom-primary member" data-bs-dismiss="modal" style="width:35%">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- // -->



                    <div class="member-footer rmt-50">
                        <img src="./img/member/logo.png" alt="하단로고" class="img-fluid">
                    </div>

                </section>
                <!-- // -->

            </main>
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/member.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="member">
            <header class="member-header">
                <div class="hbtn">
                    <a href="#" class="backpage"></a>
                </div>
                <div class="htitle">간편회원가입</div>
            </header>
            <!-- // -->
            <main class="member-container">

                <section class="join clear">
                    
                    <div class="join-complete">
                        <strong>환영합니다!</strong>
                        <span>아이디 <em class="dn">WONNA**</em> 로 회원 가입이 되셧습니다.</span>
                    </div>
                    <!-- // -->

                    <div class="join-c-home">
                        <button>씽크풀 시작하기</button>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" checked>
                            <label class="form-check-label" for="flexCheckChecked">
                                씽크풀을 시작 페이지로
                            </label>
                        </div>
                        <!-- // -->
                    </div>
                    <!-- // -->

                    <div class="simple-guide text-start" style="border-top:0;">
                        <span>간편회원가입시 아이디,비밀번호 찾기 및 글쓰기 등 일부 서비스에 제한이 있을 수 있습니다. 모든 서비스를 이용하시려면 일반 회원가입을 진행해주세요.</span>
                    </div>

                    <div class="event-banner rmt-20">
                        <a href="#"><img src="./img/member/ev_normal.png" alt="가입 감사 이벤트" class="img-fluid"></a>
                    </div>
                    <!-- // -->

                    <div class="member-footer">
                        <img src="./img/member/logo.png" alt="하단로고" class="img-fluid">
                    </div>

                </section>
                <!-- // -->

            </main>
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/member.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="member">
            <header class="member-header">
                <div class="hbtn">
                    <a href="#" class="backpage"></a>
                </div>
                <div class="htitle">회원가입</div>
            </header>
            <!-- // -->
            <main class="member-container">
                <section class="join default">
                    <div class="login-title">일반회원가입</div>
                    <!-- // -->
                    <div class="user-input-info">
                        <div class="info">
                            <div class="input-list">
                                <div class="position-relative">
                                    <label for="userInfo01">아이디</label>
                                    <div>
                                        <input type="text" id="userInfo01" class="form-control is-valid" placeholder="4~12자리 영문,숫자만 가능">
                                        <div class="invalid-feedback">
                                            중복입니다.
                                        </div>
                                        <!-- // is-invalid 일때 -->
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo02">비밀번호</label>
                                    <div>
                                        <input type="password" id="userInfo02" class="form-control is-invalid" placeholder="6~12자리 영문, 숫자만 가능, 연속3자리 불가">
                                        <div class="invalid-feedback">영문,숫자만 입력해주세요.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo03">비밀번호확인</label>
                                    <div>
                                        <input type="password" id="userInfo03" class="form-control" >
                                        <div class="invalid-feedback">비밀번호가 다릅니다.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo04">이름</label>
                                    <div>
                                        <input type="text" id="userInfo04" class="form-control" placeholder="실명을 입력하세요.">
                                        <div class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo05">필명</label>
                                    <div>
                                        <input type="text" id="userInfo05" class="form-control" placeholder="2~6자 한글,4~12자 영문,숫자만 가능합니다.">
                                        <div class="invalid-feedback">잘못된 필명 입니다.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo06">휴대폰번호</label>
                                    <div class="num">
                                        <input type="tel" id="userInfo06" class="form-control telnum" placeholder="" pattern="[0-1]{3}-[0-0]{4}-[0-0]{4}">
                                        <button class="btn-clause-num">인증번호받기</button>
                                        <div class="invalid-feedback">잘못된 휴대폰번호 입니다.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo07"></label>
                                    <div class="num">
                                        <input type="number" id="userInfo07" class="form-control cnum" min="0000" max="9999" placeholder="인증번호 입력">
                                        <button type="submit" class="btn-clause-num black">확인</button>
                                        <!-- // -->
                                        <div class="invalid-feedback">잘못된 인증번호 입니다.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <!-- 
                                    옳바른 입력 .is-valid
                                    잘못된 입력 .is-invalid
                                 -->
                            </div>
                            <div class="eventCheck">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                                    <label class="form-check-label" for="flexCheckDefault">
                                        이벤트,무료체험 정보 받기
                                    </label>
                                </div>
                                <!-- // -->
                            </div>
                            <!-- // -->
                        </div>
                        <!-- // -->


                        <div class="guide">
                            <p>
                                간편회원 가입시 <a href="javascript:;" data-popup-id="clause">이용약관</a> 및 <a href="javascript:;" data-popup-id="clause">개인정보 처리방침</a>에 모두 동의 하는 것으로 간주 합니다.
                            </p>
                        </div>

                    </div>
                    <!-- // -->

                    <div class="event-banner">
                        <img src="./img/member/ebnr.jpg" alt="가입 감사 이벤트" class="img-fluid">
                    </div>
                    <!-- // -->

                    <div class="submit-btn">
                        <button type="submit" class="submit">가입완료</button>
                        <button class="cancel">취소</button>
                    </div>

                    <div class="member-footer">
                        <img src="./img/member/logo.png" alt="하단로고" class="img-fluid">
                    </div>

                </section>
                <!-- // -->
            </main>
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

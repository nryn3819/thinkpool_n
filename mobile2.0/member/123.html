<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/member.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="member">
            <header class="member-header">
                <div class="hbtn">
                    <a href="#" class="backpage"></a>
                </div>
                <div class="htitle">아이디 찾기</div>
            </header>
            <!-- // -->
            <main class="member-container">

                <section class="member idpw">
                    
                    <div class="member-title">
                        <strong>아이디 찾기</strong>
                    </div>
                    <!-- // -->

                    <div class="user-input-info">
                        <div class="info">
                            <div class="input-list">
                                <div class="position-relative">
                                    <label for="userInfo01">이름</label>
                                    <div>
                                        <input type="text" id="userInfo01" class="form-control" placeholder="가입시 등록한 이름을 입력하세요.">
                                        <div class="invalid-feedback">정확히 입력해주세요.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo02">휴대폰번호</label>
                                    <div>
                                        <input type="tel" id="userInfo02" class="form-control" placeholder=" ‘-’ 없이 번호만 입력하세요." pattern="[0-1]{3}-[0-0]{4}-[0-0]{4}">
                                        <div class="invalid-feedback">잘못된 휴대폰번호 입니다.</div>
                                    </div>
                                </div>
                                <!-- // -->
                            </div>
                            <!-- // -->
                        </div>
                        <!-- // -->
                    </div>

                    <div class="button text-center rmt-60">
                        <button class="btn-custom-primary member" data-bs-toggle="modal" data-bs-target="#noMember">아이디 찾기</button>
                    </div>
                    <!-- // -->

                    <div class="idpw-result rmt-60 text-center">
                        <span>※ 아이디를 확인해주세요!</span>

                        <div class="rmt-20">
                            <table class="table-custom-borderless" width="100%">
                                <colgroup>
                                    <col width="50%">
                                    <col width="*">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th scope="row">아이디</th>
                                        <th scope="row">가입일</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="text-center">
                                            <span class="">Won**</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="date">2020/11/26</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-center">
                                            <span class="">Won**</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="date">2020/11/26</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-center">
                                            <span class="">Won**</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="date">2020/11/26</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-center">
                                            <span class="">Won**</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="date">2020/11/26</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-center">
                                            <span class="">Won**</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="date">2020/11/26</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-center">
                                            <span class="">Won**</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="date">2020/11/26</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-center">
                                            <span class="">Won**</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="date">2020/11/26</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <!-- // -->

                    <div class="button text-center rmt-60">
                        <button class="btn-custom-primary member">비밀번호 찾기</button>
                        <button class="btn-custom-default member">로그인</button>
                    </div>
                    <!-- // -->

                    <div class="modal fade custom-modal1" id="noMember">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="modal-basic-text text-center rmt-20">
                                        입력하신 정보로 가입한 아이디가 없습니다.
                                    </div>
                                </div>
                                <div class="modal-footer text-center cm-footer">
                                    <button class="btn-custom-primary" data-bs-dismiss="modal" style="width:103px;">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- //modal -->




                    <div class="member-footer rmt-50">
                        <img src="./img/member/logo.png" alt="하단로고" class="img-fluid">
                    </div>

                </section>
                <!-- // -->

            </main>
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

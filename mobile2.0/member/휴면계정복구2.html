<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/member.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="member">
            <header class="member-header">
                <div class="hbtn">
                    <a href="#" class="backpage"></a>
                </div>
                <div class="htitle">휴면계정 복구</div>
            </header>
            <!-- // -->
            <main class="member-container noPadding">

                <section class="join try noPadding">
                    <div class="try-title">
                        <span>가입시 등록한 실명이름을 입력하시고 휴대폰인증 및 비밀번호 입력 후 휴면계정복구 버튼을 클릭하세요.</span>
                    </div>
                    <!-- // -->

                    <div class="rp-20">
                        <div class="login-title rmt-25">휴면계정 정보입력</div>

                        <div class="user-input-info">
                            <div class="info">
                                <div class="input-list">
                                    <div class="position-relative">
                                        <label for="userInfo01">아이디</label>
                                        <div>
                                            <input type="text" id="userInfo01" class="form-control is-valid" placeholder="4~12자리 영문,숫자만 가능">
                                            <div class="invalid-feedback">
                                                중복입니다.
                                            </div>
                                            <!-- // is-invalid 일때 -->
                                        </div>
                                    </div>
                                    <!-- // -->

                                    <div class="position-relative">
                                        <label for="userInfo04">이름</label>
                                        <div>
                                            <input type="text" id="userInfo04" class="form-control" placeholder="실명을 입력하세요.">
                                            <div class="invalid-feedback"></div>
                                        </div>
                                    </div>
                                    <!-- // -->

                                    <div class="position-relative">
                                        <label for="userInfo06">휴대폰번호</label>
                                        <div class="num">
                                            <input type="tel" id="userInfo06" class="form-control telnum" placeholder="" pattern="[0-1]{3}-[0-0]{4}-[0-0]{4}">
                                            <button class="btn-clause-num">인증번호받기</button>
                                            <div class="invalid-feedback">잘못된 휴대폰번호 입니다.</div>
                                        </div>
                                    </div>
                                    <!-- // -->

                                    <div class="position-relative">
                                        <label for="userInfo07"></label>
                                        <div class="num">
                                            <input type="number" id="userInfo07" class="form-control cnum" min="0000" max="9999" placeholder="인증번호 입력">
                                            <button type="submit" class="btn-clause-num black">확인</button>
                                            <!-- // -->
                                            <div class="invalid-feedback">잘못된 인증번호 입니다.</div>
                                        </div>
                                    </div>
                                    <!-- // -->
                                </div>
                            </div>
                            <!-- // -->

                            <div class="guide">
                                <p class="text-center">
                                    휴면 해지 문의전화 : 1666-6300
                                </p>
                            </div>

                        </div>

                        <div class="submit-btn rmt-150">
                            <button type="submit" class="submit">확인</button>
                            <button class="cancel">취소</button>
                        </div>
                        <!-- // -->

                        <div class="member-footer">
                            <img src="./img/member/logo.png" alt="하단로고" class="img-fluid">
                        </div>
                        <!-- // -->
                    </div>
                </section>
                <!-- // -->
            </main>
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

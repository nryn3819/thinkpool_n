<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/member.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="member">
            <header class="member-header">
                <div class="hbtn">
                    <a href="#"><img src="./img/member/ico_home.png" alt="홈화면 돌아가기" class="img-fluid"></a>
                </div>
                <div class="htitle">로그인</div>
            </header>
            <!-- // -->
            <main class="member-container">
                <section class="login">
                    <div class="toplogo">
                        <img src="./img/member/logo.png" alt="씽크풀로고" class="img-fluid">
                    </div>
                    <!-- //상단로고 -->

                    <div class="useridpw">

                        <div class="userid-login">
                            <div class="login-input-id">
                                <div class="input-group has-validation">
                                    <span class="input-group-text" id=""><img src="./img/member/bu_id.png" alt="" width="30"></span>
                                    <input type="text" class="form-control" id="" placeholder="아이디를 입력하세요">

                                    <div class="invalid-tooltip">
                                        잘못 되거나 가입되지 않은 아이디 입니다.
                                    </div>
                                </div>
                                <!-- // -->
                            </div>
                            <!-- //id입력 -->

                            <div class="login-input-pw">
                                <div class="input-group has-validation">
                                    <span class="input-group-text" id=""><img src="./img/member/bu_pw.png" alt="" width="20"></span>
                                    <input type="password" class="form-control" id="" placeholder="비밀번호를 입력하세요">
                                </div>
                                <!-- // -->
                            </div>
                            <!-- //pw입력 -->

                            <button type="submit" class="login-submit-btn">씽크풀 아이디 로그인</button>

                            <div class="stay">
                                <div class="stay-login">
                                    <div class="form-check form-check-inline rmr-5">
                                        <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                                        <label class="form-check-label" for="inlineCheckbox1">아이디 저장하기</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2">
                                        <label class="form-check-label" for="inlineCheckbox2">로그인 상태유지</label>
                                    </div>
                                </div>
                                <!-- // -->

                                <a href="#">SignKorea 인증서 로그인</a>
                            </div>
                        </div>

                        <div class="login-naver">
                            <button><img src="./img/member/btnG_mini.png" alt="네이버로그인" height="48"> <span>네이버 아이디로 로그인</span></button>
                        </div>
                        <!-- //네이버아이디 -->
                    </div>
                    <!-- //아이디/패스워드 입력 -->

                    <div class="loginsch">
                        <button>아이디 찾기</button>
                        <button>비밀번호 찾기</button>
                    </div>
                    <!-- //아이디/패스워드 찾기 -->

                    <div class="loginjoin">
                        <div class="default">
                            <span>글쓰기 및 유료서비스 이용할 때</span>
                            <button class="btn-custom-default sm">일반회원가입</button>
                        </div>
                        <!-- // -->

                        <div class="simple">
                            <span>MY종목만 이용할 때</span>
                            <button class="btn-custom-default sm">간편회원가입</button>
                        </div>
                        <!-- // -->
                    </div>
                    <!-- //회원가입 -->
                </section>
                <!-- //login -->
            </main>
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

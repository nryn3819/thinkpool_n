<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/member.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="member">
            <header class="member-header">
                <div class="hbtn">
                    <a href="#" class="backpage"></a>
                </div>
                <div class="htitle">아이디 찾기</div>
            </header>
            <!-- // -->
            <main class="member-container">

                <section class="member idpw">
                    
                    <div class="member-title">
                        <strong>비밀번호 찾기</strong>
                    </div>
                    <!-- // -->

                    <div class="user-input-info">
                        <div class="info">
                            <div class="input-list">
                                <div class="position-relative">
                                    <label for="userInfo01">아이디</label>
                                    <div>
                                        <input type="text" id="userInfo01" class="form-control" placeholder="아이디를 입력하세요.">
                                        <div class="invalid-feedback">정확히 입력해주세요.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo02">이름</label>
                                    <div>
                                        <input type="text" id="userInfo02" class="form-control" placeholder="가입시 등록한 이름을 입력하세요.">
                                        <div class="invalid-feedback">정확히 입력해주세요.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo06">휴대폰번호</label>
                                    <div class="num lg">
                                        <input type="tel" id="userInfo06" class="form-control" placeholder=" ‘-’ 없이 번호만 입력하세요." pattern="[0-1]{3}-[0-0]{4}-[0-0]{4}">
                                        <button class="btn-clause-num lg">인증번호받기</button>
                                        <div class="invalid-feedback">잘못된 휴대폰번호 입니다.</div>
                                    </div>
                                </div>
                                <!-- // -->

                                <div class="position-relative">
                                    <label for="userInfo07">인증번호 입력</label>
                                    <div class="num">
                                        <input type="number" id="userInfo07" class="form-control cnum" min="0000" max="9999" placeholder="인증번호 입력">
                                        <button type="submit" class="btn-clause-num sm">확인</button>
                                        <!-- // -->
                                        <div class="invalid-feedback">잘못된 인증번호 입니다.</div>
                                    </div>
                                </div>
                                <!-- // -->
                            </div>
                            <!-- // -->
                        </div>
                        <!-- // -->
                    </div>

                    <div class="pw-guide">
                        <div><span>비밀번호찾기에 어려움이 있으시면 고객센터 1666-6300 으로 연락주시기 바랍니다.</span></div>
                        <div><span>네이버로그인 회원은 이용이 불가 합니다.</span></div>
                    </div>

                    <div class="button text-center rmt-60">
                        <button class="btn-custom-primary member">확인</button>
                    </div>
                    <!-- // -->

                    <div class="modal fade custom-modal1" id="modal1" aria-hidden="true" style="display: none;">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="modal-basic-text text-center rmt-20">
                                        인증이 완료되었습니다.
                                    </div>
                                </div>
                                <div class="modal-footer text-center cm-footer">
                                    <button class="btn-custom-primary" data-bs-dismiss="modal" style="width:103px;">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- // -->

                    <div class="modal fade custom-modal1" id="modal2" aria-hidden="true" style="display: none;">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="modal-basic-text text-center rmt-20">
                                        없는 정보이거나 입력한 정보가 맞지 않습니다.
                                    </div>
                                </div>
                                <div class="modal-footer text-center cm-footer">
                                    <button class="btn-custom-primary" data-bs-dismiss="modal" style="width:103px;">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- // -->

                    <div class="modal fade custom-modal1" id="modal3" aria-hidden="true" style="display: none;">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="modal-basic-text text-center rmt-20">
                                        카카오톡으로 인증번호가 전송되었습니다. <br>
                                        카카오톡이 없으시면 SMS문자로 전송 됩니다.
                                    </div>
                                </div>
                                <div class="modal-footer text-center cm-footer">
                                    <button class="btn-custom-primary" data-bs-dismiss="modal" style="width:103px;">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- // -->
                    




                    <div class="member-footer rmt-50">
                        <img src="./img/member/logo.png" alt="하단로고" class="img-fluid">
                    </div>

                </section>
                <!-- // -->

            </main>
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

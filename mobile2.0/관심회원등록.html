<!doctype html>
<html lang="ko">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common.css -->
    <link rel="stylesheet" href="./css/common.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <title>씽크풀</title>
  </head>
  <body>

    <div id="app">
        <div id="wrap">
            <h1 class="visually-hidden">씽크풀</h1>
            <h2 class="visually-hidden">Title for screen readers</h2>
            <a class="visually-hidden-focusable" href="#container">Skip to main content</a>
            <div class="visually-hidden-focusable">A container with a <a href="#">focusable element</a>.</div>
            <!-- header - header.scss -->
            <header id="header" class="clearfix item">
                <h2 class="visually-hidden">상단영역</h2>
                <div id="top" class="float-start">
                    
                    <div class="pageBack">
                        <button type="button" onclick="history.back()">이전페이지</button>
                    </div>
                    <!-- //이전페이지 -->
                
                    <div class="headerTitle text-truncate centerHeader">
                        <strong>관심회원 등록</strong>
                    </div>
                    <!-- //종목명  헤더가 바뀝니다. -->

                    <div class="rightBtn">
                        <a href="#">앱다운로드 〉</a>
                    </div>

                </div>
                <!-- //top -->
            </header>
            <!-- // -->

            <main id="container" class="clearfix">
                <h2 class="visually-hidden">본문영역</h2>

                <section class="section noPadding">
                    .
                </section>
            </main>

            <footer id="footer" class="clearfix">
                <menu id="fmenu">
                    <figure class="figure">
                        <img src="./img/flogin.png" class="figure-img img-fluid" alt="로그인">
                        <figcaption class="figure-caption text-center rmt-7">로그인</figcaption>
                    </figure>
                    <figure class="figure">
                        <img src="./img/fpc.png" class="figure-img img-fluid" alt="PC버전">
                        <figcaption class="figure-caption text-center rmt-7">PC버전</figcaption>
                    </figure>
                    <figure class="figure">
                        <img src="./img/fdw.png" class="figure-img img-fluid" alt="씽크풀앱 다운로드">
                        <figcaption class="figure-caption text-center">씽크풀앱<br>다운로드</figcaption>
                    </figure>
                </menu>

                <menu id="fmenu2">
                    <a href="#">고객센터</a>
                    <a href="#">이용약관</a>
                    <a href="#">개인정보처리방침</a>
                </menu>

                <div class="copyright">
                    <span class="d-block">@Thinkpool</span>
                    <span class="d-block">
                        본사이트에서 게재되는 정보는 오류 및 지연이 있을 수 있으며 <br>
                        그 이용에 따르는 책임은 이용자 본인에게 있습니다. 
                    </span>
                </div>
            </footer>
            
        </div>
        <!-- /wrap -->

        <!-- bootstrap js -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <!-- //bootstrap js -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

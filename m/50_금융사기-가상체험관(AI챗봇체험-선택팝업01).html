<!doctype html>
<html lang="ko">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!-- common.css -->
  <link rel="stylesheet" href="./css/common.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <!-- swiper -->
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
  <script src="https://fastly.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <title>씽크풀</title>
</head>

<body>

  <div id="app">
    <div id="wrap">
      <h1 class="visually-hidden">씽크풀</h1>
      <h2 class="visually-hidden">Title for screen readers</h2>
      <a class="visually-hidden-focusable" href="#container">Skip to main content</a>
      <div class="visually-hidden-focusable">A container with a <a href="#">focusable element</a>.</div>

      <main id="container" class="clearfix">
        <h2 class="visually-hidden">본문영역</h2>
        <section class="section fraud-virtual">
          <div class="virtual-header">
            <div>
              <span>
                <img width="25" src="img/call-icon.png" alt="">
              </span>
              <strong>보이스 피싱 가상체험</strong>
            </div>
            <button class="end" data-bs-toggle="modal" data-bs-target="#endVirtual">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M19.6151 19.6151L11.769 11.769M11.769 11.769L3.92285 3.92285M11.769 11.769L19.6152 3.92285M11.769 11.769L3.92285 19.6152" stroke="#999999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <!-- 타이틀 -->
          <div class="virtual-phishing">
            <div class="phone-header call ai">
              <div class="flexcenter call">
                <span><img width="30" src="img/call-icon02.png" alt=""></span>
                <span>010-3XX0-8242  <em>통화중...</em></span>
              </div>
            </div>
            <div class="phone-body call ai">
              <div class="message left">
                <p>고객님, 이 부분이 가장 중요하므로 명확히 이해하셔야 다음 단계로 진행할 수 있습니다. 이 절차를 잘 이해하셨습니까?</p>
              </div>
              <div class="message right">
                <p>바로 다시 전화 드릴게요.</p>
              </div>
            </div>
            <!-- 스크립트 -->
            <script>
              function typeEffect(element, text, speed, onComplete) {
                let i = 0;
                const length = text.length;
                element.innerHTML = ''; // Clear the element
                const interval = setInterval(() => {
                  if (i < length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    scrollToBottom();
                  } else {
                    clearInterval(interval);
                    if (onComplete) onComplete();
                  }
                }, speed);
              }

              function showMessages() {
                const messages = document.querySelectorAll('.message');
                let delay = 1000; 
                let currentMessageIndex = 0;

                function showNextMessage() {
                  if (currentMessageIndex < messages.length) {
                    const message = messages[currentMessageIndex];
                    const p = message.querySelector('p');
                    const text = p.getAttribute('data-full-text') || p.innerHTML; // 데이터 속성에서 전체 텍스트 가져오기
                    p.innerHTML = ''; // 빈 내용으로 초기화
                    message.style.display = 'block';

                    if (message.classList.contains('left')) {
                      typeEffect(p, text, 50, () => {
                        currentMessageIndex++;
                        setTimeout(showNextMessage, 1000); // 각 메시지 후 1초 대기
                      });
                    } else if (message.classList.contains('right')) {
                      p.innerHTML = text;
                      currentMessageIndex++;
                      scrollToBottom();
                      setTimeout(showNextMessage, 1000); // 각 메시지 후 1초 대기
                    }

                    setTimeout(() => {
                      const container = document.querySelector('.phone-body');
                      container.scrollTop = container.scrollHeight;
                    }, 500);
                  } else{
                    setTimeout(() => {
                      document.querySelector('#openChoice').click();
                    }, 1000)
                  }
                }

                messages.forEach(message => {
                  const p = message.querySelector('p');
                  p.setAttribute('data-full-text', p.innerHTML);
                });

                setTimeout(showNextMessage, delay); // 첫 메시지 타이핑 시작
              }

              // 메세지 스크롤
              function scrollToBottom() {
                const phoneBody = document.querySelector('.phone-body');
                phoneBody.scrollTo({
                  top: phoneBody.scrollHeight,
                  behavior: 'smooth'
                });
              }

              window.onload = showMessages;
            </script>
            <!-- 채팅입력 -->
            <div class="chatInput">
              <div class="inputGroup">
                <input type="text" placeholder="메시지내용 입력">
                <button>
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="25" viewBox="0 0 24 25" fill="none">
                    <rect y="0.5" width="24" height="24" rx="8" fill="#666973" />
                    <path d="M12 3.5L7 8.5M12 3.5L17 8.5M12 3.5V21.5" stroke="white" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- 사용자 선택 팝업 -->
        <div class="modal fade choice" id="choice" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-body">
                <div class="title">통화 종료 후 선택</div>
                <div class="txt">
                  원 대출은행인 [은행명]은행으로 전화를 걸어 대출 10% 일부 상환을 위해 가상계좌번호 안내를 받으시겠습니까?
                </div>
                <div class="choiceBtn">
                  <button class="rmb-10">[은행명]은행에서 가상계좌 안내 받기</button>
                  <button>상담 종료하기</button>
                </div>
              </div>
            </div>
            <button id="openChoice" data-bs-toggle="modal" data-bs-target="#choice"></button>
          </div>
        </div>
      </main>

    </div>
    <!-- /wrap -->
    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"></script>
    <!-- //bootstrap js -->
  </div>
  <!-- //app -->



</body>

</html>

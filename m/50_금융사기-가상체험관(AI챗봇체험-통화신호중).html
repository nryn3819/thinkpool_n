<!doctype html>
<html lang="ko">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!-- common.css -->
  <link rel="stylesheet" href="./css/common.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <!-- swiper -->
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
  <script src="https://fastly.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <title>씽크풀</title>
</head>

<body>

  <div id="app">
    <div id="wrap">
      <h1 class="visually-hidden">씽크풀</h1>
      <h2 class="visually-hidden">Title for screen readers</h2>
      <a class="visually-hidden-focusable" href="#container">Skip to main content</a>
      <div class="visually-hidden-focusable">A container with a <a href="#">focusable element</a>.</div>

      <main id="container" class="clearfix">
        <h2 class="visually-hidden">본문영역</h2>
        <section class="section fraud-virtual">
          <div class="virtual-header">
            <div>
              <span>
                <img width="25" src="img/call-icon.png" alt="">
              </span>
              <strong>보이스 피싱 가상체험</strong>
            </div>
            <button class="end" data-bs-toggle="modal" data-bs-target="#endVirtual">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M19.6151 19.6151L11.769 11.769M11.769 11.769L3.92285 3.92285M11.769 11.769L19.6152 3.92285M11.769 11.769L3.92285 19.6152" stroke="#999999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <!-- 타이틀 -->
          <div class="virtual-phishing">
            <div class="phone-body calling">
              <div>
                <div class="name">
                  [은행명]은행 고객센터
                  <span>1588-5000</span>
                </div>
                <div class="icon">
                  <div class="txt">연결중</div>
                  <div class="call">
                    <svg xmlns="http://www.w3.org/2000/svg" width="123" height="123" viewBox="0 0 123 123" fill="none">
                      <path
                        d="M48.3251 21.4432C46.7685 17.5517 42.9995 15 38.8082 15H24.7105C19.3476 15 15 19.3465 15 24.7095C15 70.2948 51.9552 107.25 97.5405 107.25C102.904 107.25 107.25 102.902 107.25 97.5391L107.252 83.439C107.252 79.2478 104.701 75.4794 100.81 73.9228L87.298 68.5201C83.8024 67.1218 79.8225 67.7511 76.9302 70.1613L73.443 73.0697C69.3704 76.4635 63.3781 76.1936 59.6295 72.445L49.8101 62.6167C46.0615 58.8681 45.7845 52.8806 49.1783 48.808L52.0862 45.321C54.4964 42.4288 55.1313 38.4477 53.733 34.9521L48.3251 21.4432Z"
                        fill="#38D038" />
                    </svg>
                    <span class="dot dot01">
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13" fill="none">
                        <circle cx="6.5" cy="6.5" r="6.5" fill="#38D038" />
                      </svg>
                    </span>
                    <span class="dot dot02">
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13" fill="none">
                        <circle cx="6.5" cy="6.5" r="6.5" fill="#38D038" />
                      </svg>
                    </span>
                    <span class="dot dot03">
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 13 13" fill="none">
                        <circle cx="6.5" cy="6.5" r="6.5" fill="#38D038" />
                      </svg>
                    </span>
                  </div>
                </div>
              </div>
              <div class="buttonGroup">
                <button>
                  <img width="38" src="img/di_call.png" alt="">
                  <span>통화</span>
                </button>
                <button>
                  <img width="38" src="img/di_call_end.png" alt="">
                  <span>종료</span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>

    </div>
    <!-- /wrap -->
    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"></script>
    <!-- //bootstrap js -->
  </div>
  <!-- //app -->



</body>

</html>

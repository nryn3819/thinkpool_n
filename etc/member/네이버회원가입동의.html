<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Cache-Control" content="No-Cache">
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title></title>
    <!-- css -->
    <link rel="stylesheet" href="./css/font.css" media="screen" title="no title" charset="utf-8">
    <link rel="stylesheet" href="./css/import.css" media="screen" title="no title" charset="utf-8">
    <!-- //css -->
    <!-- script -->
    <script type="text/javascript" src="./js/jquery-1.12.4.min.js"></script>
    <script type="text/javascript" src="./js/jquery.bxslider.min.js"></script>
    <!-- script -->
</head>

<body>
    <div id="member_wrap">
        <header id="header">
            <div class="stg_header">
                <div class="title">
                    <a href="#타이틀">회원가입</a>
                </div>
                <!-- // 페이지 타이틀 -->

                <div class="header_right">
                    <div class="page_close">
                        <a href="#닫기"><img src="./img/ico_close.png" alt=""></a>
                    </div>
                    <!-- //페이지닫기 -->
                </div>
                <!-- //우측버튼 -->

                <div class="page_back">
                    <a href="#이전페이지"><img src="./img/ico_back.png" alt="이전 페이지"></a>
                </div>
                <!-- //이전페이지 -->
            </div>
            <!-- //마이페이지 상단 영역 -->
        </header>
        <!-- //header -->

        <hr>
        <main>
            <div class="login_w">

                <div class="cpt nv">

                    <div class="cpt_txt">
                        <strong><em>네이버 로그인</em>이용<br>씽크풀 회원가입 약관동의</strong>
                    </div>
                    <!-- //가입완료안내문 -->

                    <div class="join_caution ta_c">
                        <p>네이버로그인 가입시 <a href="javascript:;" data-popup-id="clause">이용약관</a> 및 <a href="javascript:;"

                    </div>
                    <!-- //약관 -->

                </div>

            </div>
            <div class="join_event">
                <a href="#"><img src="./img/ev_bnr.png" alt="가입감사 이벤트"></a>
            </div>
            <!-- //이벤트배너 -->

            <div class="join_btn half">
                <a href="#추가정보입력" class="act ft_l">확인</a>
                <a href="#무시하고로그인" class="ft_r">취소</a>
            </div>

            <div class="logo">
                <img src="./img/logo.png" alt="씽크풀 로고">
            </div>
            <!-- //로그인로고 -->
        </main>
    </div>

</html>

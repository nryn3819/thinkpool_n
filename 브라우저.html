<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thinkpool</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
</head>

<body>
    <div id="error_w">
        <div id="error">
            <div class="top">
                <div class="left">
                    <img src="./img/header/logo.png" alt="씽크풀">
                </div>
                <div class="right">
                    <a href="#">씽크풀 홈</a>
                </div>
            </div>
            <!-- //top -->

            <div class="con">
                <strong>
                    접속하신 브라우저에서는 일부 서비스가 <br>
                    원활하게 제공되지 않을 수 있습니다.
                </strong>

                <span>
                    <em>(1단계)</em> <br>
                    호환성 보기 설정을 변경해주세요 <br>
                    브라우저 우측 상단 톱니바퀴 > 호환성보기설정 > thinkpool.com 삭제
                </span>

                <div class="btn-group">
                    <a href="#">자세히보기</a>
                </div>

                <span>
                    <em>(2단계)</em> <br>
                    1단계 후에서 접속이 안되면 최신 버전브라우저로 업데이트 해주세요
                </span>

                <div class="btn-group">
                    <a href="#">크롬브라우저 설치하기</a>
                    <a href="#">IE 엣지 설치하기</a>
                </div>
            </div>
            <!-- // -->




            <div class="htsGuide">
                <strong>증권사 HTS에서 접속하신 경우에는<br>아래 버튼을 이용해주세요.</strong>

                <div class="htsBtn">
                    <a href="https://www.thinkpool.com/stockDiscuss/068270/list" target="_blank">셀트리온 토론실</a>
                    <a href="https://www.thinkpool.com/compDiscuss/list" target="_blank">씽크풀 토론실 메인</a>
                </div>
                <!-- // -->
            </div>
            <!-- //hts 가이드 -->
            
        </div>
        <!-- //error -->
    </div>


    <style>
        *{
            font-size: 100%;
            font-family: 'Noto Sans KR', sans-serif;
        }
        body,
        html {
            height: 100%;
            margin:0%;
            padding:0;
        }
        #errow_w{
            position:relative;
            width:100%;
            min-width:500px;
            min-height:100%;
            overflow:hidden;
        }
        #error {
            position:absolute;
            top:50%;
            left:50%;
            margin:-300px 0 0 -250px;
            width: 500px;
            min-height:300px;
        }

        #error .top {
            display: block;
            width: 480px;
            padding: 0 10px 15px 10px;
            text-align: center;
            float: left;
            border-bottom: 2px solid #000;
        }

        #error .top .left {
            display: block;
            float: left;
        }

        #error .top .right {
            display: block;
            float: right;
        }

        #error .top .right a {
            display: inline-block;
            height: 23px;
            line-height: 23px;
            color: #333;
            font-weight: 300;
            font-size: 15px;
            text-decoration: underline;
        }

        #error .con {
            display: block;
            width: 480px;
            float: left;
            padding: 35px 10px 20px 10px;
        }

        #error .con strong {
            display: block;
            font-size: 26px;
            line-height: 33px;
            color: #333;
            font-weight: 700;
            text-align:center;
        }

        #error .con span {
            padding-top: 15px;
            display: block;
            width:100%;
            font-size: 14px;
            color: #999;
            line-height: 20px;
            letter-spacing: -0.025em;
            text-align:center;
            float:left;
        }
        #error .con span em{
            font-size:16px;
            color:#333;
            font-weight:700;
            font-style:normal;

        }

        #error .btn-group{
            display:block;
            width:100%;
            float:left;
            text-align:center;
            margin-top:15px;
            margin-bottom:5px;
            float:left;
        }
        #error .btn-group a{
            display:inline-block;
            width:170px;
            height:36px;
            line-height:36px;
            background:#000;
            border-radius: 5px;
            font-size:15px;
            color:#fff;
            font-weight:300;
            text-align:center;
            text-decoration: none;
        }

        #error .htsGuide{
            display:block;
            width:100%;
            height:175px;
            background:#f5f5f5;
            margin-top:20px;
            float:left;
        }

        #error .htsGuide strong{
            display:block;
            width:100%;
            text-align:center;
            font-size:20px;
            font-weight:700;
            color:#333;
            text-align:center;
            line-height:26px;
            float:left;
            margin-top:30px;
        }

        #error .htsGuide .htsBtn{
            display:block;
            width:100%;
            float:left;
            margin-top:25px;
            text-align:Center;
        }
        #error .htsGuide .htsBtn a{
            display:inline-block;
            width:170px;
            height:34px;
            line-height:34px;
            border:1px solid #3e72ed;
            border-radius:3px;
            text-align:Center;
            font-size:16px;
            color:#3e72ed;
            font-weight:300;
            background:#fff;
            margin:0 15px;
            text-decoration: none;
        }
        #error .htsGuide .htsBtn a:hover{
            background:#3e72ed;
            color:#fff;
            font-weight:400;
        }
    </style>
</body>

</html>

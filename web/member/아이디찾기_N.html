<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=480">
    <title>아이디 찾기 | 씽크풀</title>
    <link rel="stylesheet" href="https://img.thinkpool.com/www/member/css/member_n.css">
    <script src="https://img.thinkpool.com/www/member/js/member_n.js" defer></script>
  </head>
  <body>
    <div class="member-page member-page--find-id">
      <header class="member-header">
        <button type="button" class="member-header__back" aria-label="이전 화면">
          <span class="member-header__back-icon" aria-hidden="true"></span>
        </button>
        <a class="member-header__brand" href="/" aria-label="씽크풀 홈">
          <img src="https://img.thinkpool.com/www/member/img/logo-thinkpool.png" alt="THINKPOOL">
        </a>
        <span class="member-header__spacer" aria-hidden="true"></span>
      </header>

      <main class="member-main">
        <section class="member-section" aria-labelledby="find-id-title">
          <h1 id="find-id-title" class="member-title">아이디 찾기</h1>

          <form class="member-form" action="#" method="post">
            <div class="form-field">
              <label class="form-field__label" for="find-id-name">이름</label>
              <input
                id="find-id-name"
                class="form-field__input"
                type="text"
                name="name"
                placeholder="가입시 등록한 이름을 입력하세요."
                autocomplete="name"
                required
              >
            </div>

            <div class="form-field">
              <label class="form-field__label" for="find-id-phone">휴대폰번호</label>
              <input
                id="find-id-phone"
                class="form-field__input"
                type="tel"
                name="phone"
                placeholder="‘-’ 없이 번호만 입력하세요."
                autocomplete="tel"
                inputmode="numeric"
                required
              >
              <p class="form-error" role="alert" data-warning-key="member-mismatch">
                <span class="form-error__icon" aria-hidden="true">!</span>
                회원이 아니거나 입력정보가 맞지 않습니다.
              </p>
            </div>

            <button class="button button--primary button--block" type="submit">아이디 찾기</button>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>

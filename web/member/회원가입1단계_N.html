<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=480">
    <title>회원가입 1단계 | 씽크풀</title>
    <link rel="stylesheet" href="https://img.thinkpool.com/www/member/css/member_n.css">
    <script src="https://img.thinkpool.com/www/member/js/member_n.js" defer></script>
  </head>
  <body>
    <div class="member-page member-page--signup">
      <header class="member-header">
        <button type="button" class="member-header__back" aria-label="이전 화면">
          <span class="member-header__back-icon" aria-hidden="true"></span>
        </button>
        <a class="member-header__brand" href="/" aria-label="씽크풀 홈">
          <img src="https://img.thinkpool.com/www/member/img/logo-thinkpool.png" alt="THINKPOOL">
        </a>
        <span class="member-header__spacer" aria-hidden="true"></span>
      </header>

      <main class="member-main">
        <section class="member-section" aria-labelledby="signup-step1-title">
          <h1 id="signup-step1-title" class="member-title">회원가입</h1>

          <div class="member-step" aria-label="회원가입 2단계 중 1단계">
            <strong class="member-step__count">1/2</strong>
            <span class="member-step__title">아이디 만들기</span>
            <span class="member-step__line" aria-hidden="true"></span>
          </div>

          <form class="member-form" action="./회원가입2단계_N.html" method="post">
            <div class="form-field">
              <label class="form-field__label" for="signup-id">아이디</label>
              <input
                id="signup-id"
                class="form-field__input"
                type="text"
                name="userId"
                autocomplete="username"
                aria-describedby="signup-id-error"
                required
              >
              <p class="form-error" role="alert" data-warning-key="id-format">
                <span class="form-error__icon" aria-hidden="true">!</span>
                4~12자리 영문과 숫자로 입력하세요
              </p>
              <p id="signup-id-error" class="form-error" role="alert" data-warning-key="id-unavailable">
                <span class="form-error__icon" aria-hidden="true">!</span>
                사용할 수 없는 아이디입니다. 다른 아이디로 설정하세요
              </p>
              <p class="form-complete" role="status" data-complete-key="id-available">
                사용 가능한 아이디입니다
              </p>
            </div>

            <fieldset class="form-fieldset">
              <legend class="form-field__label">비밀번호</legend>
              <div class="form-field">
                <label class="visually-hidden" for="signup-password">비밀번호</label>
                <input
                  id="signup-password"
                  class="form-field__input"
                  type="password"
                  name="password"
                  placeholder="비밀번호를 입력해 주세요."
                  autocomplete="new-password"
                  minlength="6"
                  required
                >
              </div>
              <div class="form-field">
                <label class="visually-hidden" for="signup-password-confirm">비밀번호 확인</label>
                <input
                  id="signup-password-confirm"
                  class="form-field__input"
                  type="password"
                  name="passwordConfirm"
                  placeholder="비밀번호 확인을 위해 한번더 입력해 주세요."
                  autocomplete="new-password"
                  minlength="6"
                  aria-describedby="signup-password-error"
                  required
                >
              </div>
              <div class="form-error-list">
                <p id="signup-password-error" class="form-error" role="alert" data-warning-key="password-minlength">
                  <span class="form-error__icon" aria-hidden="true">!</span>
                  최소 6글자 이상을 입력해 주세요
                </p>
                <p class="form-error" role="alert" data-warning-key="password-sequential-numbers">
                  <span class="form-error__icon" aria-hidden="true">!</span>
                  3개 이상이 연속한 숫자는 사용이 불가합니다.
                </p>
                <p class="form-error" role="alert" data-warning-key="password-confirm-required">
                  <span class="form-error__icon" aria-hidden="true">!</span>
                  비밀번호 확인을 위해 한번 더 입력해 주세요
                </p>
                <p class="form-error" role="alert" data-warning-key="password-mismatch">
                  <span class="form-error__icon" aria-hidden="true">!</span>
                  처음 입력한 비밀번호와 다릅니다
                </p>
              </div>
            </fieldset>

            <button class="button button--primary button--block" type="submit">다음</button>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>

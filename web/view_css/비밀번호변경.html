<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>thinkpool</title>
        <!-- font -->
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
        <!-- Latest compiled and minified CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
        <!-- Optional theme -->
        <link
        rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap-theme.min.css" integrity="sha384-6pzBo3FDv/PJ8r2KRkGHifhEocL+1X2rVCTTkUfGk7/0pbek5mMa1upzvWbrUbOZ" crossorigin="anonymous">
        <!-- basic css -->
        <link rel="stylesheet" href="./css/common.css">
        <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
        <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
                  <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
                  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
                <![endif]-->
        <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
        <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha384-nvAa0+6Qg9clwYCGGPpDQLVpLNn0fRaROjHqs13t4Ggj3Ez50XnGQqc/r8MhnRDZ" crossorigin="anonymous"></script>
        <!-- Latest compiled and minified JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js" integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd" crossorigin="anonymous"></script>
        <!-- bxslider -->
        <script src="https://cdn.jsdelivr.net/bxslider/4.2.12/jquery.bxslider.min.js"></script>
        <!-- basic js -->
        <!-- <script src="js/main.js"></script> -->
    </head>
    <body>

    <div id="app">
        <div id="member">
            <header id="member-header">
                <div class="hbtn">
                    <a href="#" class="backpage"></a>
                </div>
                <div class="htitle">비밀번호 변경</div>
            </header>
            <!-- // -->
            <main id="member-container">

                <section class="member change">
                    
                    <div class="member-title">
                        <strong>비밀번호 변경</strong>
                    </div>
                    <!-- // -->

                    <div class="user-input-info">
                        <div class="info">
                            <div class="input-list">
                                <form action="" class="form-horizontal">
                                    <div class="form-group has-success">
                                        <label for="" class="control-label">현재비밀번호</label>
                                        <input type="password" class="form-control" name="" id="" placeholder="비밀번호를 입력하세요.">
                                        <span id="" class="help-block">정확히 입력해주세요.</span>
                                    </div>
                                    <!-- // -->
                                    <div class="form-group has-error">
                                        <label for="" class="control-label">새비밀번호</label>
                                        <input type="password" class="form-control" name="" id="" placeholder="새 비밀번호를 입력하세요.">
                                        <span id="" class="help-block">6~12자리 영문, 숫자만 가능하며, <br>연속하여 동일한 영문 또는 숫자3자리 이상 사용불가</span>
                                    </div>
                                    <!-- // -->
                                    <div class="form-group">
                                        <label for="" class="control-label">새비밀번호 확인</label>
                                        <input type="text" class="form-control" name="" id="" placeholder="새 비밀번호를 다시한번 입력하세요.">
                                        <span id="" class="help-block">입력하신 비밀번호가 다릅니다.</span>
                                    </div>
                                    <!-- // -->

                                    
                                </form>
                            </div>
                            <!-- // -->
                        </div>
                        <!-- // -->
                    </div>
                    <!-- // 125 -->

                    <div class="pw-complete">

                        <div class="">
                            <span>
                                현재 회원님은 <em class="dn">네이버아이디</em>로 로그인 하셨습니다. 
                                <br><br>
                                네이버아이디로 로그인 하신 경우, 씽크풀 비밀번호가
                                없으므로 비밀번호 변경이 불가능 합니다. 
                            </span>
                        </div>

                    </div>

                    <div class="button text-center mt-60">
                        <button class="btn-custom-primary member">변경완료</button>
                    </div>
                    <!-- // 125 -1 -->

                    <div class="modal fade custom-modal1" id="modal1" aria-hidden="true" style="display: none;">
                        <div class="modal-dialog modal-sm">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="modal-basic-text text-center rmt-20">
                                        새 비밀번호를 다시 확인해주세요.
                                    </div>
                                </div>
                                <div class="modal-footer text-center cm-footer">
                                    <button class="btn-custom-primary" data-dismiss="modal" style="width:103px;">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- // -->

                    <div class="modal fade custom-modal1" id="modal2" aria-hidden="true" style="display: none;">
                        <div class="modal-dialog modal-sm">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="modal-basic-text text-center rmt-20">
                                        비밀번호가 변경되었습니다. <br>다시 로그인 하시기 바랍니다.
                                    </div>
                                </div>
                                <div class="modal-footer text-center cm-footer">
                                    <button class="btn-custom-primary" data-dismiss="modal" style="width:103px;">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- // -->

                    <div class="modal fade custom-modal1" id="modal3" aria-hidden="true" style="display: none;">
                        <div class="modal-dialog modal-sm">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="modal-basic-text text-center rmt-20">
                                        비밀번호는 <span class="dn">6~12자리 영문, 숫자</span>만 가능 연속하여 <br>
                                        동일 영문, 또는 숫자3자리 이상 사용 불가 합니다. 

                                    </div>
                                </div>
                                <div class="modal-footer text-center cm-footer">
                                    <button class="btn-custom-primary" data-dismiss="modal" style="width:103px;">확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- // -->



                    <div class="member-footer text-center mt-60">
                        <img src="./img/sub/member/logo.png" alt="하단로고" class="" width="180">
                    </div>

                </section>
                <!-- // -->

            </main>
        </div>
        <!-- /wrap -->
    </div>
    <!-- //app -->

    
    
  </body>
</html>

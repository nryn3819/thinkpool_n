<!DOCTYPE html>
<html>
  <head>
  	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0" />
  	<meta http-equiv="X-UA-Compatible" content="IE=edge">
  	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  	<meta http-equiv="Cache-Control" content="No-Cache">
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
  	<title></title>
    <!-- css -->
    <link rel="stylesheet" href="./css/font.css" media="screen" title="no title" charset="utf-8"> <!-- url 적용 안될시 열어주세요 -->
    <link rel="stylesheet" href="./css/import.css" media="screen" title="no title" charset="utf-8">
    <!-- //css -->
    <!-- script -->
    <script type="text/javascript" src="./js/jquery-1.12.4.min.js"></script>
    <!-- script -->
  </head>
  <body>
      <div id="member_wrap">
          <header id="header">
            <div class="stg_header">
                <div class="title">
                    <a href="#타이틀">씽크풀 간편회원가입</a>
                </div>
                <!-- // 페이지 타이틀 -->

                <div class="header_right">
                    <div class="page_close">
                        <a href="#닫기"><img src="./img/ico_close.png" alt=""></a>
                    </div>
                    <!-- //페이지닫기 -->
                </div>
                <!-- //우측버튼 -->
            
                <div class="page_back">
                    <a href="#이전페이지"><img src="./img/ico_back.png" alt="이전 페이지"></a>
                </div>
                <!-- //이전페이지 -->
            </div>
            <!-- //마이페이지 상단 영역 -->
          </header>
          <!-- //header -->

          <hr>
          <main>
              <div class="login_w">

                <div class="user_input">
                  <dl>
                    <dt>아이디</dt>
                    <dd>
                      <input type="text" placeholder="4~12자리 영문,숫자만 가능">
                      <em class="fail on">중복입니다.</em><!-- css display:none -->
                      <em class="cpt on">사용가능</em><!-- css display:none -->
                    </dd>
                    <!-- 아이디 -->

                    <dt>비밀번호</dt>
                    <dd>
                      <input type="password" placeholder="6~12자리 영문,숫자만 가능,연속3자리불가">
                    </dd>
                    <!-- 비밀번호 -->

                    <dt>비밀번호확인</dt>
                    <dd>
                      <input type="password">
                    </dd>
                    <!-- 비밀번호확인 -->
                  </dl>
                </div>
                <!-- //입력 -->

                <div class="join_btn">
                  <a href="#간편가입완료" class="act ft_l">간편가입완료</a>
                  <a href="#일반회원가입" class="ft_r">일반회원가입</a>
                </div>
                <!-- //가입버튼 -->

                <div class="join_caution">
                  <p>간편회원 가입시 <a href="#">이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 모두 동의 하는 것으로 간주 합니다.</p>
                </div>
                <!-- //약관 -->

                <div class="join_guide">
                  간편회원가입시 아이디,비밀번호 찾기 및 글쓰기 등 일부 서비스에 제한이 있을 수 있습니다.
                  모든 서비스를 이용하시려면 일반 회원가입을 진행해주세요.
                </div>
                <!-- 가입 안내문 -->

                <div class="join_event">
                  <a href="#"><img src="./img/ev_normal.png" alt="일반회원가입 가입감사 이벤트"></a>
                </div>
                <!-- //이벤트배너 -->

                <div class="logo">
                  <img src="./img/logo.png" alt="씽크풀 로그">
                </div>
                <!-- //로그인로고 -->

              </div>
          </main>
      </div>
  </body>
</html>

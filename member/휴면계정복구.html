<!DOCTYPE html>
<html>
  <head>
  	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0" />
  	<meta http-equiv="X-UA-Compatible" content="IE=edge">
  	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  	<meta http-equiv="Cache-Control" content="No-Cache">
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
  	<title></title>
    <!-- css -->
    <link rel="stylesheet" href="./css/font.css" media="screen" title="no title" charset="utf-8">
    <link rel="stylesheet" href="./css/import.css" media="screen" title="no title" charset="utf-8">
    <!-- //css -->
    <!-- script -->
    <script type="text/javascript" src="./js/jquery-1.12.4.min.js"></script>
    <!-- script -->
  </head>
  <body>
      <div id="member_wrap">
          <header id="header">
            <div class="stg_header">
                <div class="title">
                    <a href="#타이틀">휴면계정 복구</a>
                </div>
                <!-- // 페이지 타이틀 -->

                <div class="header_right">
                    <div class="page_close">
                        <a href="#닫기"><img src="./img/ico_close.png" alt=""></a>
                    </div>
                    <!-- //페이지닫기 -->
                </div>
                <!-- //우측버튼 -->
            
                <div class="page_back">
                    <a href="#이전페이지"><img src="./img/ico_back.png" alt="이전 페이지"></a>
                </div>
                <!-- //이전페이지 -->
            </div>
            <!-- //마이페이지 상단 영역 -->
          </header>
          <!-- //header -->

          <hr>
          <main>
              <div class="cu_guide">
                가입시 등록한 실명이름을 입력하시고<br>
                휴대폰인증 및 비밀번호 입력 후 <br>
                휴면계정복구 버튼을 클릭하세요.
              </div>
              <!-- //휴면복구 안내 -->

              <div class="login_w">

                <div class="user_input">
                  <strong>휴면계정 정보입력</strong>
                  <dl>
                      <dt>아이디</dt>
                      <dd>
                          <input type="text" placeholder="4~12자리 영문, 숫자만 가능">
                          <em class="fail">중복입니다.</em>
                          <em class="cpt">사용가능</em>
                      </dd>
                      <!-- 아이디 -->
                      <dt>이름</dt>
                      <dd><input type="text" placeholder="실명을 입력하세요 – 비밀번호찾기에 쓰입니다"></dd>
                      <!-- 이름 -->
                      <dt>휴대폰번호</dt>
                      <dd><input type="text" placeholder="숫자만 입력하세요" class="num_p"><button class="num" >인증번호받기</button></dd>
                      <dd><input type="text" placeholder="인증번호 입력" class="num_e"><button class="chk">확인</button></dd>
                      <!-- 휴대폰번호 -->
                  </dl>
                </div>
                <!-- //입력 -->

                <div class="join_caution">
                  <p>휴면 해지 문의전화 : 1666-6300</p>
                </div>

              </div>
              
              <div class="join_btn full mt_100">
                <a href="#확인" class="act ft_l">확인</a>
                <a href="#취소" class="ft_r">취소</a>
              </div>
              <!-- //가입버튼 -->
              
              <div class="logo">
                <img src="./img/logo.png" alt="씽크풀 로고">
              </div>
              <!-- //로그인로고 -->
          </main>
      </div>
  </body>
</html>
